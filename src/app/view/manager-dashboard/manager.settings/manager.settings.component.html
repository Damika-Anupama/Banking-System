<!-- Page Header -->
<div class="mb-8 animate-fade-in">
  <h1 class="text-4xl font-bold text-white mb-2">Settings</h1>
  <p class="text-white/70">Update your personal information and preferences</p>
</div>

<!-- Loading Indicator -->
<div *ngIf="isLoading" class="flex justify-center items-center py-20">
  <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-white"></div>
</div>

<!-- Settings Form -->
<div *ngIf="!isLoading" class="glass-card p-6 animate-slide-up max-w-4xl">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-white mb-1 flex items-center">
      <i class="fas fa-user-edit mr-3 text-glass-purple"></i>
      Change Your Details
    </h2>
    <p class="text-white/60 text-sm">Update your account information</p>
  </div>

  <form (ngSubmit)="saveSettings()" #settingsForm="ngForm" class="space-y-5">
    <!-- Username -->
    <div>
      <label for="username" class="block text-white/80 text-sm font-medium mb-2">
        Username <span class="text-red-400">*</span>
      </label>
      <div class="relative">
        <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-white/50"></i>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          (blur)="markTouched('username')"
          [class.field-invalid]="errorFor('username')"
          [attr.aria-invalid]="errorFor('username') ? 'true' : null"
          [attr.aria-describedby]="errorFor('username') ? 'username-error' : null"
          class="glass-input pl-12"
          placeholder="Enter username"
          required
          minlength="3"
         id="username"/>
        <p *ngIf="errorFor('username')" id="username-error" role="alert" class="field-error"><i class="fas fa-circle-exclamation" aria-hidden="true"></i>{{ errorFor('username') }}</p>
      </div>
    </div>

    <!-- Full Name -->
    <div>
      <label for="fullname" class="block text-white/80 text-sm font-medium mb-2">
        Full Name <span class="text-red-400">*</span>
      </label>
      <div class="relative">
        <i class="fas fa-id-card absolute left-4 top-1/2 transform -translate-y-1/2 text-white/50"></i>
        <input
          type="text"
          [(ngModel)]="fullname"
          name="fullname"
          (blur)="markTouched('fullname')"
          [class.field-invalid]="errorFor('fullname')"
          [attr.aria-invalid]="errorFor('fullname') ? 'true' : null"
          [attr.aria-describedby]="errorFor('fullname') ? 'fullname-error' : null"
          class="glass-input pl-12"
          placeholder="Enter full name"
          required
         id="fullname"/>
        <p *ngIf="errorFor('fullname')" id="fullname-error" role="alert" class="field-error"><i class="fas fa-circle-exclamation" aria-hidden="true"></i>{{ errorFor('fullname') }}</p>
      </div>
    </div>

    <!-- Email -->
    <div>
      <label for="email" class="block text-white/80 text-sm font-medium mb-2">
        Email Address <span class="text-red-400">*</span>
      </label>
      <div class="relative">
        <i class="fas fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-white/50"></i>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          (blur)="markTouched('email')"
          [class.field-invalid]="errorFor('email')"
          [attr.aria-invalid]="errorFor('email') ? 'true' : null"
          [attr.aria-describedby]="errorFor('email') ? 'email-error' : null"
          class="glass-input pl-12"
          placeholder="Enter email address"
          required
          email
         id="email"/>
        <p *ngIf="errorFor('email')" id="email-error" role="alert" class="field-error"><i class="fas fa-circle-exclamation" aria-hidden="true"></i>{{ errorFor('email') }}</p>
      </div>
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="block text-white/80 text-sm font-medium mb-2">
        Password <span class="text-white/50 text-xs">(leave empty to keep current)</span>
      </label>
      <div class="relative">
        <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-white/50"></i>
        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          (blur)="markTouched('password')"
          [class.field-invalid]="errorFor('password')"
          [attr.aria-invalid]="errorFor('password') ? 'true' : null"
          [attr.aria-describedby]="errorFor('password') ? 'password-error' : null"
          class="glass-input pl-12 pr-12"
          placeholder="Enter new password"
         id="password"/>
        <p *ngIf="errorFor('password')" id="password-error" role="alert" class="field-error"><i class="fas fa-circle-exclamation" aria-hidden="true"></i>{{ errorFor('password') }}</p>
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white/50 hover:text-white/80 transition-colors"
         [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword">
          <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
        </button>
      </div>
    </div>

    <!-- Address -->
    <div>
      <label for="address" class="block text-white/80 text-sm font-medium mb-2">
        Address
      </label>
      <div class="relative">
        <i class="fas fa-map-marker-alt absolute left-4 top-4 text-white/50"></i>
        <textarea
          [(ngModel)]="address"
          name="address"
          class="glass-input pl-12 resize-none"
          rows="3"
          placeholder="Enter address"
         id="address"></textarea>
      </div>
    </div>

    <!-- Contact Number -->
    <div>
      <label for="contactNo" class="block text-white/80 text-sm font-medium mb-2">
        Contact Number
      </label>
      <div class="relative">
        <i class="fas fa-phone absolute left-4 top-1/2 transform -translate-y-1/2 text-white/50"></i>
        <input
          type="tel"
          [(ngModel)]="contactNo"
          name="contactNo"
          class="glass-input pl-12"
          placeholder="Enter contact number"
          pattern="[0-9]{10}"
         id="contactNo"/>
      </div>
    </div>

    <!-- Date of Birth -->
    <div>
      <label for="dob" class="block text-white/80 text-sm font-medium mb-2">
        Date of Birth
      </label>
      <div class="relative">
        <i class="fas fa-calendar absolute left-4 top-1/2 transform -translate-y-1/2 text-white/50 z-10"></i>
        <input
          type="date"
          [(ngModel)]="dob"
          name="dob"
          class="glass-input pl-12 appearance-none cursor-pointer"
         id="dob"/>
      </div>
    </div>

    <!-- Gender Selection -->
    <div>
      <label for="gender-MALE" class="block text-white/80 text-sm font-medium mb-3">
        Gender
      </label>
      <div class="grid grid-cols-3 gap-4">
        <label for="gender-MALE" class="cursor-pointer">
          <input
            type="radio"
            [(ngModel)]="gender"
            name="gender"
            value="MALE"
            class="hidden peer"
           id="gender-MALE"/>
          <div class="p-4 rounded-xl backdrop-blur-md bg-white/5 border-2 border-white/10 transition-all duration-300 peer-checked:border-glass-blue peer-checked:bg-white/10">
            <div class="flex flex-col items-center gap-2">
              <i class="fas fa-mars text-glass-blue text-2xl"></i>
              <div class="text-white font-semibold text-sm">Male</div>
            </div>
          </div>
        </label>

        <label for="gender-FEMALE" class="cursor-pointer">
          <input
            type="radio"
            [(ngModel)]="gender"
            name="gender"
            value="FEMALE"
            class="hidden peer"
           id="gender-FEMALE"/>
          <div class="p-4 rounded-xl backdrop-blur-md bg-white/5 border-2 border-white/10 transition-all duration-300 peer-checked:border-glass-pink peer-checked:bg-white/10">
            <div class="flex flex-col items-center gap-2">
              <i class="fas fa-venus text-glass-pink text-2xl"></i>
              <div class="text-white font-semibold text-sm">Female</div>
            </div>
          </div>
        </label>

        <label for="gender-OTHER" class="cursor-pointer">
          <input
            type="radio"
            [(ngModel)]="gender"
            name="gender"
            value="OTHER"
            class="hidden peer"
           id="gender-OTHER"/>
          <div class="p-4 rounded-xl backdrop-blur-md bg-white/5 border-2 border-white/10 transition-all duration-300 peer-checked:border-glass-purple peer-checked:bg-white/10">
            <div class="flex flex-col items-center gap-2">
              <i class="fas fa-genderless text-glass-purple text-2xl"></i>
              <div class="text-white font-semibold text-sm">Other</div>
            </div>
          </div>
        </label>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="flex gap-3 pt-4">
      <button
        type="submit"
        [disabled]="isSaving"
        class="glass-button justify-center"
        [class.opacity-50]="isSaving"
        [class.cursor-not-allowed]="isSaving"
      >
        <i *ngIf="!isSaving" class="fas fa-save mr-2"></i>
        <i *ngIf="isSaving" class="fas fa-spinner fa-spin mr-2"></i>
        {{ isSaving ? 'Saving...' : 'Save Changes' }}
      </button>
      <button
        type="button"
        (click)="resetForm()"
        [disabled]="isSaving"
        class="glass-button-secondary justify-center"
        [class.opacity-50]="isSaving"
        [class.cursor-not-allowed]="isSaving"
      >
        <i class="fas fa-undo mr-2"></i>
        Reset
      </button>
    </div>
  </form>
</div>
