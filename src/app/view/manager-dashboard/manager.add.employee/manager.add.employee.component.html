<!-- Page Header -->
<section class="demo-page-header animate-fade-in">
  <span class="demo-eyebrow"><i class="fas fa-user-tie"></i> Branch staffing</span>
  <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
    <div>
      <h1 class="demo-title">Add Employee</h1>
      <p class="demo-subtitle">Create a new employee account for your branch.</p>
    </div>
  </div>
</section>

<!-- Registration Form -->
<section class="demo-section-card animate-slide-up">
  <div class="mb-6">
    <h2 class="demo-section-title"><i class="fas fa-user-tie mr-2 text-glass-cyan"></i>Employee information</h2>
    <p class="demo-section-helper">All fields are required. The account is created for your branch.</p>
  </div>

  <form class="space-y-5">
    <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
      <div class="min-w-0">
        <label class="auth-field-label"><i class="fas fa-id-card mr-2"></i>Full name <span class="text-red-300">*</span></label>
        <input type="text" class="glass-input w-full" placeholder="Enter full name" [(ngModel)]="fullname" name="fullname" />
      </div>

      <div class="min-w-0">
        <label class="auth-field-label"><i class="fas fa-user mr-2"></i>Username <span class="text-red-300">*</span></label>
        <input type="text" class="glass-input w-full" placeholder="Enter username" [(ngModel)]="username" name="username" />
      </div>

      <div class="min-w-0">
        <label class="auth-field-label"><i class="fas fa-lock mr-2"></i>Password <span class="text-red-300">*</span></label>
        <input type="password" class="glass-input w-full" placeholder="Enter password" [(ngModel)]="password" name="password" />
      </div>

      <div class="min-w-0">
        <label class="auth-field-label"><i class="fas fa-users mr-2"></i>User type</label>
        <input type="text" class="glass-input w-full cursor-not-allowed opacity-70" value="Employee" disabled />
      </div>

      <div class="min-w-0">
        <label class="auth-field-label"><i class="fas fa-envelope mr-2"></i>Email <span class="text-red-300">*</span></label>
        <input type="email" class="glass-input w-full" placeholder="Enter email address" [(ngModel)]="email" name="email" />
      </div>

      <div class="min-w-0">
        <label class="auth-field-label"><i class="fas fa-phone mr-2"></i>Contact number <span class="text-red-300">*</span></label>
        <input type="tel" class="glass-input w-full" placeholder="Enter contact number" [(ngModel)]="contact_no" name="contact_no" />
      </div>

      <div class="min-w-0">
        <label class="auth-field-label"><i class="fas fa-venus-mars mr-2"></i>Gender <span class="text-red-300">*</span></label>
        <div class="relative">
          <select class="glass-input w-full appearance-none cursor-pointer pr-10" [(ngModel)]="gender" name="gender">
            <option value="" disabled selected>Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
          <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-white/50 pointer-events-none"></i>
        </div>
      </div>

      <div class="min-w-0">
        <label class="auth-field-label"><i class="fas fa-calendar mr-2"></i>Date of birth <span class="text-red-300">*</span></label>
        <input type="date" class="glass-input w-full" [(ngModel)]="dob" name="dob" />
      </div>
    </div>

    <div class="min-w-0">
      <label class="auth-field-label"><i class="fas fa-map-marker-alt mr-2"></i>Address <span class="text-red-300">*</span></label>
      <textarea class="glass-input w-full resize-none" rows="3" placeholder="Enter address" [(ngModel)]="address" name="address"></textarea>
    </div>

    <div class="pt-2">
      <button type="button" class="glass-button w-full justify-center sm:w-auto" (click)="submit()" [disabled]="isLoading" [class.opacity-50]="isLoading">
        <i *ngIf="!isLoading" class="fas fa-user-plus mr-2"></i>
        <i *ngIf="isLoading" class="fas fa-spinner fa-spin mr-2"></i>
        {{ isLoading ? 'Adding...' : 'Add employee' }}
      </button>
    </div>
  </form>
</section>
