<div *ngIf="isOpen" class="shortcut-overlay" (click)="close()">
  <div class="shortcut-modal" (click)="$event.stopPropagation()" role="dialog" aria-label="Keyboard shortcuts" aria-modal="true">
    <div class="shortcut-header">
      <h2 class="shortcut-title"><i class="fas fa-keyboard" aria-hidden="true"></i>Keyboard shortcuts</h2>
      <button id="shortcut-help-close" type="button" class="shortcut-close" (click)="close()" aria-label="Close keyboard shortcuts">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>

    <ul class="shortcut-list">
      <li *ngFor="let shortcut of shortcuts" class="shortcut-row">
        <span class="shortcut-keys">
          <kbd *ngFor="let key of shortcut.keys">{{ key }}</kbd>
        </span>
        <span class="shortcut-description">{{ shortcut.description }}</span>
      </li>
    </ul>

    <p class="shortcut-footnote">Press <kbd>?</kbd> anywhere to open this sheet.</p>
  </div>
</div>
