name: CI

# Every push to this branch auto-deploys. Nothing was checking it first, so a
# crash like the one that made the transaction ledger throw on every row could
# ship straight to production. This is the gate.
on:
  push:
    branches: [frontend-demo, main]
  pull_request:
    branches: [frontend-demo, main]

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, unit tests and the production build. Fast, so it fails fast.
  verify:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # The icon subset step shells out to `pyftsubset` (fonttools) to rebuild
      # the .woff2 files. The runner does not ship it, so `npm run icons` would
      # die with ENOENT before it could check anything. brotli is what lets
      # fonttools emit the woff2 flavour.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font subsetting tool
        run: pip install fonttools brotli

      - name: Lint
        run: npx ng lint

      # The icon font is subsetted from the icons the source actually names.
      # A template can reference a glyph the font does not carry and nothing
      # fails — the icon just silently does not render (this shipped five
      # sprints in a row once). Regenerate and require a clean diff.
      #
      # We diff only icons.css — the generated manifest of which glyphs made it
      # into the subset — not the .woff2 binaries. woff2/brotli output is not
      # byte-reproducible across fonttools versions and platforms, so diffing
      # the font itself is a false-positive machine; icons.css is deterministic
      # (a sorted glyph list from a source scan) and fully captures the "did you
      # regenerate after adding an icon" intent. A missing glyph at runtime is
      # separately caught by the "every visible icon renders a glyph" e2e test.
      - name: Icon subset is current
        run: |
          npm run icons
          git diff --exit-code src/assets/icons/icons.css

      # ChromeHeadlessCI (see karma.conf.js) adds --no-sandbox and generous
      # timeouts so the browser is not killed mid-run on a contended runner.
      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Production build
        run: npx ng build --configuration production

      # The e2e job serves this build rather than rebuilding it.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # The layer that catches what unit tests structurally cannot: a template that
  # throws on render, a button too disabled to click, a focus trap that no-ops.
  e2e:
    name: End-to-end
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
